<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pro app · 播放页改版（音视频合并内容流）</title>
<style>
  :root{
    color-scheme: dark;

    --logo-hi:#124A38;          /* 音频 logo 卡片 · 受光 */
    --logo-lo:#062319;          /* 音频 logo 卡片 · 背光 */
    --accent:#26D699;
    --accent-soft:#4FE6AE;
    --text:#F2F8F5;
    --text-dim:rgba(242,248,245,.72);

    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",sans-serif;

    --W:428px;
    --H:926px;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}
  body{
    background:#101413;
    background-image:radial-gradient(120% 90% at 50% 0%, #161B19 0%, #0C100F 70%);
    font-family:var(--font);
    display:flex;align-items:center;justify-content:center;
    padding:28px 16px;overflow:auto;
  }

  .fit{position:relative}
  .canvas{position:absolute;top:0;left:0;transform-origin:top left}

  .screen{
    position:relative;
    width:var(--W);height:var(--H);
    border-radius:44px;overflow:hidden;isolation:isolate;
    color:var(--text);user-select:none;touch-action:none;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06);
  }

  /* ── 内容流：4 条内容纵向排布，跟手滑动翻页 ───────── */
  .feed{width:var(--W);will-change:transform}
  .page{
    position:relative;width:var(--W);height:var(--H);overflow:hidden;
    background:
      radial-gradient(50% 20% at 24% 2%, rgba(130,245,205,.06) 0%, rgba(130,245,205,0) 74%),
      radial-gradient(66% 26% at 50% 42%, rgba(18,152,108,.11) 0%, rgba(18,152,108,0) 72%),
      radial-gradient(104% 52% at 50% 70%, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 82%),
      linear-gradient(180deg,#0A2E22 0%, #072018 20%, #04130E 46%, #030C09 66%, #071C15 100%);
  }

  /* ══ 状态栏（只在第一条上显示，跟真实 App 一致）══ */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:54px;
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 26px 0;font-size:16px;font-weight:640;letter-spacing:.01em;
  }
  .statusbar .glyphs{display:flex;align-items:center;gap:6px}
  .statusbar svg{display:block}

  /* ══ 顶部导航 ════════════════════════════════════ */
  .nav .collapse{
    position:absolute;left:14px;top:76px;width:36px;height:36px;
    display:grid;place-items:center;background:none;border:0;color:var(--text);
    cursor:pointer;border-radius:50%;transition:background .18s ease;
  }
  .nav .collapse:hover{background:rgba(255,255,255,.08)}
  .nav .head{position:absolute;left:56px;right:56px;top:70px;text-align:center;pointer-events:none}
  .nav .head .ep-title{
    font-size:18px;font-weight:560;line-height:22px;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nav .head .show{margin-top:2px;font-size:13px;font-weight:560;line-height:16px;color:#E4EDE9}

  /* ══ 音频条目的 logo ═════════════════════════════ */
  /* 没有外框了：整块 348×348 的卡片本身就是 logo，主色是深墨绿 */
  .logo{
    position:absolute;left:40px;top:121px;width:348px;height:348px;border-radius:14px;
    background:linear-gradient(160deg,var(--logo-hi) 0%, #0B3628 46%, var(--logo-lo) 100%);
    box-shadow:0 18px 44px -22px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.08);
    overflow:hidden;
    /* 文字和麦克风作为一个整体在卡片里居中 */
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  }
  .logo::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 80% at 18% 6%,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 58%);
    pointer-events:none;
  }
  .logo .show{
    position:relative;
    font-size:16px;font-weight:700;line-height:1;letter-spacing:-.012em;
    color:var(--accent-soft);
  }
  .micmark{
    position:relative;width:68px;height:136px;flex:none;display:block;
    filter:drop-shadow(0 0 22px rgba(168,255,222,.22));
  }

  /* ══ 视频条目的封面 ══════════════════════════════ */
  /* 左右撑满整屏宽、不留间距，高度按 16:9 推出；上下居中在 y=295，与音频条目对齐 */
  .videobox{
    position:absolute;left:0;top:174.625px;width:428px;height:240.75px;
    overflow:hidden;background:#0B1512;
  }

  /* 视频条目：画面 + 右下角扩大按钮 */
  .vframe{display:block;width:100%;height:100%;object-fit:cover}
  .expand{
    position:absolute;right:10px;bottom:10px;width:31px;height:31px;
    border-radius:10px;border:1px solid rgba(255,255,255,.20);
    background:rgba(8,18,15,.5);backdrop-filter:blur(10px);
    display:grid;place-items:center;cursor:pointer;color:#fff;
    transition:transform .16s ease,background .16s ease;z-index:3;
  }
  .expand:hover{background:rgba(8,18,15,.72)}
  .expand:active{transform:scale(.9)}

  /* ══ 轮播圆点 ════════════════════════════════════ */
  .dots{
    position:absolute;left:0;right:0;top:485px;
    display:flex;justify-content:center;align-items:center;gap:7px;
  }
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.30)}
  .dots i.on{background:#fff}

  /* ══ 操作图标行 ══════════════════════════════════ */
  .actions{
    position:absolute;left:105px;top:579px;width:243px;height:24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .actions button{
    width:24px;height:24px;background:none;border:0;padding:0;cursor:pointer;
    color:rgba(255,255,255,.92);display:grid;place-items:center;
    transition:transform .16s ease,color .16s ease;
  }
  .actions button:hover{color:#fff;transform:translateY(-2px)}
  .actions button.on{color:var(--accent-soft)}
  .actions svg{display:block}

  /* ══ 进度条 ══════════════════════════════════════ */
  .scrub{
    position:absolute;left:0;right:0;top:679px;height:26px;
    display:flex;align-items:center;padding:0 11px 0 17px;gap:10px;
  }
  .scrub .t{font-size:13px;font-weight:500;color:var(--text-dim);font-variant-numeric:tabular-nums;flex:none}
  .scrub .t.right{min-width:39px;text-align:right}
  .track{position:relative;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);cursor:pointer}
  .track .fill{
    position:absolute;inset:0 auto 0 0;width:15%;border-radius:2px;background:var(--accent);
    box-shadow:0 0 10px rgba(38,214,153,.75);
  }
  .track .knob{
    position:absolute;top:50%;left:15%;width:16px;height:16px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 .5px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.55), 0 0 14px rgba(38,214,153,.45);
    transition:transform .12s ease;
  }
  .track:hover .knob{transform:translate(-50%,-50%) scale(1.12)}

  /* ══ 播放控制 ════════════════════════════════════ */
  .controls{position:absolute;left:0;right:0;top:779px;height:73px}
  .controls button{
    position:absolute;top:50%;transform:translate(-50%,-50%);
    background:none;border:0;padding:0;cursor:pointer;color:#fff;
    display:grid;place-items:center;transition:transform .16s ease;
  }
  .controls button:active{transform:translate(-50%,-50%) scale(.9)}
  .ctl-speed{
    left:22.8px;width:29.7px;height:29.7px;border:1.3px solid rgba(255,255,255,.85);border-radius:50%;
    font-size:11px;font-weight:500;letter-spacing:-.02em;
  }
  .ctl-back{left:112px;width:35px;height:35px}
  .ctl-play{left:214px;width:73px;height:73px}
  .ctl-fwd{left:316px;width:35px;height:35px}
  .ctl-timer{left:404.8px;width:26px;height:26px}
  .ctl-back svg,.ctl-fwd svg{width:35px;height:35px;display:block}
  .ctl-play svg{width:73px;height:73px;display:block}
  .ctl-timer svg{width:26px;height:26px;display:block}

  /* ══ 右侧内容流位置指示 ══════════════════════════ */
  .pager{
    position:absolute;right:7px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:5px;z-index:9;pointer-events:none;
  }
  .pager i{width:2.5px;height:13px;border-radius:2px;background:rgba(255,255,255,.20);transition:background .2s ease}
  .pager i.on{background:rgba(255,255,255,.85)}

  /* ══ 横屏全屏 ════════════════════════════════════ */
  .fs{
    position:absolute;inset:0;background:#000;z-index:50;
    opacity:0;visibility:hidden;transition:opacity .26s ease,visibility .26s;
  }
  .fs.on{opacity:1;visibility:visible}
  /* 926×428 的横屏舞台，绕自身中心转 90° 后正好铺满 428×926 的屏幕 */
  .fs-frame{
    position:absolute;left:50%;top:50%;
    width:926px;height:428px;
    transform:translate(-50%,-50%) rotate(90deg);
    display:grid;place-items:center;
  }
  .fs-frame img{display:block;width:100%;height:100%;object-fit:contain}
  .fs-collapse{
    position:absolute;right:22px;top:18px;width:38px;height:38px;border-radius:12px;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.10);
    backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;color:#fff;
    transition:transform .16s ease,background .16s ease;
  }
  .fs-collapse:hover{background:rgba(255,255,255,.20)}
  .fs-collapse:active{transform:scale(.9)}
  .fs-bar{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;align-items:center;gap:16px;padding:0 44px 26px;
  }
  .fs-bar .t{font-size:14px;font-weight:500;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;flex:none}
  .fs-track{position:relative;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
  .fs-track i{position:absolute;inset:0 auto 0 0;width:22%;border-radius:2px;background:var(--accent);display:block}

  button:focus-visible,.track:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="fit" id="fit">
<div class="canvas" id="canvas">
<div class="screen" id="screen">

  <!-- 共享 SVG 定义（麦克风渐变 / 挖空遮罩） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="micGrad" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#F1FAF6"/><stop offset="1" stop-color="#D4EBE2"/>
    </linearGradient>
    <mask id="micKnock" maskUnits="userSpaceOnUse" x="0" y="0" width="22" height="44">
      <rect width="22" height="44" fill="#000"/>
      <rect x="4.5" y="0" width="13" height="24" rx="6.5" fill="#fff"/>
      <path d="M0 15v4.2a11 11 0 0 0 22 0V15" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M11 30.6v7.6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M4.6 43.4h12.8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      <g stroke="#000" stroke-width="1.5" stroke-linecap="round">
        <path d="M4.5 8.4h13"/><path d="M4.5 14h13"/><path d="M4.5 19.6h13"/>
      </g>
    </mask>
  </defs></svg>

  <div class="feed" id="feed"></div>

  <div class="pager" id="pager"></div>

  <!-- ── 横屏全屏播放 ─────────────────────────── -->
  <div class="fs" id="fs" role="dialog" aria-modal="true" aria-label="横屏播放">
    <div class="fs-frame">
      <img class="vsrc" alt="">
      <button class="fs-collapse" id="fsCollapse" aria-label="缩小，退出横屏播放">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.6 3.6 8.2 8.2"/><path d="M5.5 8.2H8.2V5.5"/>
            <path d="M20.4 3.6 15.8 8.2"/><path d="M18.5 8.2h-2.7V5.5"/>
            <path d="M20.4 20.4 15.8 15.8"/><path d="M18.5 15.8h-2.7v2.7"/>
            <path d="M3.6 20.4 8.2 15.8"/><path d="M5.5 15.8H8.2v2.7"/>
          </g>
        </svg>
      </button>
      <div class="fs-bar">
        <span class="t">05:12</span>
        <div class="fs-track"><i></i></div>
        <span class="t">-18:33</span>
      </div>
    </div>
  </div>

</div>
</div>
</div>

<script>
(function () {
  /* ════════ 内容流数据 ════════ */
  var ITEMS = [
    { type:'audio', ep:'Demo Audio Episode', show:'Demo Channel Title', dur:988,  cur:148 },
    { type:'video', ep:'Demo Video Episode', show:'Demo Channel Title', dur:1425, cur:312 }
  ];
  var H = 926, N = ITEMS.length;

  /* ════════ 图标 ════════ */
  var ICON = {
    chevron:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.4 8 12 15.4 19.6 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    dl:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 7.8H4.45v12.7h15.1V7.8H14.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 4.2v9.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9.45 10.6 12 14.1l2.55-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    heart:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path class="heartPath" d="M12 20.4C10.5 19.2 3.6 14.6 3.6 9.7a4.7 4.7 0 0 1 8.4-2.9 4.7 4.7 0 0 1 8.4 2.9c0 4.9-6.9 9.5-8.4 10.7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    share:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.4 7.3H6.8A3.2 3.2 0 0 0 3.6 10.5v6.6a3.2 3.2 0 0 0 3.2 3.2h10.4a3.2 3.2 0 0 0 3.2-3.2v-3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9.4 17.1A10 10 0 0 1 18.4 5.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M15.48 4.37 18.4 5.9 15.81 7.95" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    more:'<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.4" r="1.65" fill="currentColor"/><circle cx="12" cy="12" r="1.65" fill="currentColor"/><circle cx="12" cy="18.6" r="1.65" fill="currentColor"/></svg>',
    expand:'<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.6 4.4h5v5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.6 4.4 13 11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M9.4 19.6h-5v-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.4 19.6 11 13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>'
  };

  /* 麦克风图形：渐变与遮罩定义在文档顶部的共享 <defs> 里，这里只引用 */
  var MIC_SVG = '<svg class="micmark" viewBox="0 0 22 44" role="img" aria-label="Demo Episode Logo 麦克风标识">'
    + '<rect width="22" height="44" fill="url(#micGrad)" mask="url(#micKnock)"/></svg>';

  var STATUS_BAR = '<div class="statusbar"><span>11:35</span><span class="glyphs">'
    + '<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="4.5" y="6" width="3" height="6" rx="1" fill="#fff"/><rect x="9" y="3.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="13.5" y="1" width="3" height="11" rx="1" fill="#fff"/></svg>'
    + '<svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M8.5 10.6 6.2 8.2a3.4 3.4 0 0 1 4.6 0L8.5 10.6Z" fill="#fff"/><path d="M4.1 6.1a6.5 6.5 0 0 1 8.8 0" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M1.4 3.1a10.4 10.4 0 0 1 14.2 0" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>'
    + '<svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".8" y=".8" width="22" height="11.4" rx="3.4" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.1"/><rect x="2.8" y="2.8" width="16" height="7.4" rx="2" fill="#fff"/><path d="M25 4.6v3.8a2.1 2.1 0 0 0 0-3.8Z" fill="rgba(255,255,255,.45)"/></svg>'
    + '</span></div>';

  var CONTROLS = function (i) {
    return '<div class="controls" data-i="' + i + '">'
      + '<button class="ctl-speed" data-act="speed" aria-label="播放速度">1.0x</button>'
      + '<button class="ctl-back" data-act="back" aria-label="后退 30 秒">'
      + '<svg viewBox="0 0 36 36" aria-hidden="true">'
      + '<path d="M7.04 29.16A15.5 15.5 0 1 0 7.04 7.24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>'
      + '<path d="M10.27 6.55 7.04 7.24 7.73 4.01Z" fill="#fff"/>'
      + '<text x="18" y="23.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">30</text></svg></button>'
      + '<button class="ctl-play" data-act="play" aria-label="播放" aria-pressed="false">'
      + '<svg viewBox="0 0 73 73" aria-hidden="true"><circle cx="36.5" cy="36.5" r="35.5" fill="none" stroke="#fff" stroke-width="2"/>'
      + '<path class="playGlyph" d="M28.4 22.6a1.9 1.9 0 0 1 2.88-1.63l18.2 12.3a1.9 1.9 0 0 1 0 3.26l-18.2 12.3a1.9 1.9 0 0 1-2.88-1.63Z" fill="#fff" transform="translate(1,1)"/></svg></button>'
      + '<button class="ctl-fwd" data-act="fwd" aria-label="前进 30 秒">'
      + '<svg viewBox="0 0 36 36" aria-hidden="true">'
      + '<path d="M25.75 31.62A15.5 15.5 0 1 1 25.75 4.78" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>'
      + '<path d="M24.25 1.84 25.75 4.78 22.46 4.95Z" fill="#fff"/>'
      + '<text x="18" y="23.4" text-anchor="middle" font-size="15" font-weight="400" fill="#fff">30</text></svg></button>'
      + '<button class="ctl-timer" aria-label="睡眠定时">'
      + '<svg viewBox="0 0 26 26" aria-hidden="true">'
      + '<circle cx="13" cy="13.6" r="8.3" fill="none" stroke="#fff" stroke-width="1.5"/>'
      + '<path d="M13 13.6V7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>'
      + '<path d="M13 13.6H6.4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>'
      + '<path d="M7.5 4.3A3.35 3.35 0 0 0 4.3 7.5" fill="none" stroke="#fff" stroke-width="2.7"/>'
      + '<path d="M18.5 4.3A3.35 3.35 0 0 1 21.7 7.5" fill="none" stroke="#fff" stroke-width="2.7"/>'
      + '<path d="M7.9 20.1 6.4 22.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>'
      + '<path d="M18.1 20.1 19.6 22.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>'
      + '</svg></button>'
      + '</div>';
  };

  function pageHTML(it, i) {
    var isVideo = it.type === 'video';
    var media = isVideo
      ? '<div class="videobox">'
        + '<img class="vframe vsrc" alt="视频画面">'
        + '<button class="expand" data-act="expand" aria-label="全屏播放">' + ICON.expand + '</button>'
        + '</div>'
      : '<div class="logo">'
        + '<div class="show">Demo Episode Logo</div>' + MIC_SVG
        + '</div>';

    return '<section class="page' + (isVideo ? ' is-video' : '') + '" data-i="' + i + '">'
      + (i === 0 ? STATUS_BAR : '')
      + '<div class="nav">'

    p.querySelector('.scrub .t.right').textContent = '-' + fmt(s.dur - s.cur);
    p.querySelector('.track').setAttribute('aria-valuenow', Math.round(s.cur));
    p.querySelector('.track').setAttribute('aria-valuetext', fmt(s.cur));
  }
  function setPlaying(i, on) {
    if (on) { for (var k = 0; k < N; k++) if (k !== i && ST[k].playing) setPlaying(k, false); }
    ST[i].playing = on;
    var p = pages[i], btn = p.querySelector('[data-act="play"]');
    var PLAY = 'M28.4 22.6a1.9 1.9 0 0 1 2.88-1.63l18.2 12.3a1.9 1.9 0 0 1 0 3.26l-18.2 12.3a1.9 1.9 0 0 1-2.88-1.63Z';
    var PAUSE = 'M27.5 23.4a2 2 0 0 1 2-2h4.6a2 2 0 0 1 2 2v27.2a2 2 0 0 1-2 2h-4.6a2 2 0 0 1-2-2Z'
              + 'M40.4 23.4a2 2 0 0 1 2-2h4.6a2 2 0 0 1 2 2v27.2a2 2 0 0 1-2 2h-4.6a2 2 0 0 1-2-2Z';
    btn.querySelector('.playGlyph').setAttribute('d', on ? PAUSE : PLAY);
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? '暂停' : '播放');
  }
  function tick() {
    for (var i = 0; i < N; i++) {
      if (!ST[i].playing) continue;
      ST[i].cur += ST[i].speed;
      if (ST[i].cur >= ST[i].dur) { ST[i].cur = ST[i].dur; setPlaying(i, false); }
      renderScrub(i);
    }
  }
  setInterval(tick, 1000);

  /* ════════ 操作派发 ════════ */
  screen.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) {
      var box = e.target.closest('.videobox');
      if (box) { var i0 = +box.closest('.page').dataset.i; setPlaying(i0, !ST[i0].playing); }
      return;
    }
    var page = btn.closest('.page'), i = +page.dataset.i, act = btn.dataset.act;
    if (act === 'play') setPlaying(i, !ST[i].playing);
    else if (act === 'back') { ST[i].cur = Math.max(0, ST[i].cur - 30); renderScrub(i); }
    else if (act === 'fwd')  { ST[i].cur = Math.min(ST[i].dur, ST[i].cur + 30); renderScrub(i); }
    else if (act === 'speed') {
      var order = [1, 1.25, 1.5, 2, 0.8];
      var k = order.indexOf(ST[i].speed);
      if (k < 0) k = 0;
      ST[i].speed = order[(k + 1) % order.length];
      btn.textContent = ST[i].speed + 'x';
    }
    else if (act === 'like') {
      ST[i].liked = !ST[i].liked;
      btn.classList.toggle('on', ST[i].liked);
      btn.setAttribute('aria-pressed', String(ST[i].liked));
      btn.querySelector('.heartPath').setAttribute('fill', ST[i].liked ? 'currentColor' : 'none');
    }
    else if (act === 'expand') { openFs(); }
  });

  /* 进度条拖动 */
  var dragSeek = null;
  screen.addEventListener('pointerdown', function (e) {
    var tr = e.target.closest('.track');
    if (!tr) return;
    var i = +tr.closest('.page').dataset.i;
    dragSeek = i;
    seek(e, tr, i);
  });
  function seek(e, tr, i) {
    var r = tr.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    ST[i].cur = pct * ST[i].dur; renderScrub(i);
  }
  screen.addEventListener('pointermove', function (e) {
    if (dragSeek === null) return;
    var tr = pages[dragSeek].querySelector('.track'); if (tr) seek(e, tr, dragSeek);
  });
  window.addEventListener('pointerup', function () { dragSeek = null; });

  /* ════════ 上下滑动翻页 ════════ */
  var idx = 0, drag = false, startY = 0, moved = false, lock = false;

  function paint(y, anim) {
    feed.style.transition = anim ? 'transform .42s cubic-bezier(.22,.61,.36,1)' : 'none';
    feed.style.transform = 'translate3d(0,' + y + 'px,0)';
  }
  function go(next, anim) {
    idx = Math.max(0, Math.min(N - 1, next));
    paint(-idx * H, anim !== false);
    [].forEach.call(pager.children, function (d, k) { d.classList.toggle('on', k === idx); });
  }

  screen.addEventListener('pointerdown', function (e) {
    if (fs.classList.contains('on')) return;
    if (e.target.closest('[data-act], .track, .nav .collapse')) return;
    drag = true; moved = false; startY = e.clientY;
  });
  screen.addEventListener('pointermove', function (e) {
    if (!drag || lock) return;
    var d = e.clientY - startY;
    if (Math.abs(d) > 6) moved = true;
    var y = -idx * H + d;
    if (y > 0) y *= .32;
    else if (y < -(N - 1) * H) y = -(N - 1) * H + (y + (N - 1) * H) * .32;
    paint(y, false);
  });
  function endDrag(e) {
    if (!drag) return;
    drag = false;
    if (!moved) return;
    var d = (e.clientY || startY) - startY;
    if (d < -60) go(idx + 1); else if (d > 60) go(idx - 1); else go(idx);
  }
  screen.addEventListener('pointerup', endDrag);
  screen.addEventListener('pointercancel', endDrag);
  screen.addEventListener('pointerleave', endDrag);

  var wheelLock = false;
  screen.addEventListener('wheel', function (e) {
    if (fs.classList.contains('on')) return;
    e.preventDefault();
    if (wheelLock || Math.abs(e.deltaY) < 8) return;
    wheelLock = true; setTimeout(function () { wheelLock = false; }, 620);
    go(idx + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (fs.classList.contains('on')) { if (e.key === 'Escape') closeFs(); return; }
    if (e.key === 'ArrowDown') { go(idx + 1); e.preventDefault(); }
    if (e.key === 'ArrowUp')   { go(idx - 1); e.preventDefault(); }
  });

  /* ════════ 横屏全屏 ════════ */
  function openFs() {
    fs.classList.add('on');
    for (var i = 0; i < N; i++) setPlaying(i, false);
  }
  function closeFs() { fs.classList.remove('on'); }
  document.getElementById('fsCollapse').addEventListener('click', closeFs);

  /* ════════ 缩放适配 ════════ */
  var fitBox = document.getElementById('fit'), canvas = document.getElementById('canvas');
  function fit() {
    var pad = 56;
    var s = Math.min(1, (window.innerWidth - pad) / 428, (window.innerHeight - pad) / 926);
    fitBox.style.width = (428 * s) + 'px';
    fitBox.style.height = (926 * s) + 'px';
    canvas.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  for (var i = 0; i < N; i++) renderScrub(i);
  go(0, false);
  pager.children[0].classList.add('on');
})();
</script>
</body>
</html>
