<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pro app · 播放页改版（绿色调）</title>
<style>
  :root{
    color-scheme: dark;

    /* ── 绿色调 palette ─────────────────────────────── */
    --ink-950:#061610;          /* 页面最深处 */
    --ink-900:#0A241C;          /* 背景中段 */
    --ink-880:#0E2F24;          /* 背景顶部 / 底部回亮 */
    --plate-hi:#15AC7C;         /* 封面外框 · 顶 */
    --plate-lo:#075540;         /* 封面外框 · 底 */
    --art-tl:#34403C;           /* 封面卡片 · 左上受光 */
    --art-mid:#232E2B;
    --art-br:#1A2422;           /* 封面卡片 · 右下背光 */
    --accent:#26D699;           /* 进度条 / 文字强调 / 泛光 */
    --accent-soft:#4FE6AE;
    --text:#F2F8F5;
    --text-dim:rgba(242,248,245,.72);
    --text-mute:rgba(242,248,245,.46);

    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",sans-serif;
    --serif:Georgia,"Times New Roman","Songti SC",serif;

    --screen-w:428px;
    --screen-h:926px;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}
  body{
    background:#101413;
    background-image:radial-gradient(120% 90% at 50% 0%, #161B19 0%, #0C100F 70%);
    font-family:var(--font);
    display:flex;align-items:center;justify-content:center;
    padding:28px 16px;
    overflow:auto;
  }

  /* ── 画布：把 428×926 的屏幕等比缩放到可视区域内 ── */
  .fit{position:relative}
  .canvas{position:absolute;top:0;left:0;transform-origin:top left}

  .screen{
    position:relative;
    width:var(--screen-w);height:var(--screen-h);
    border-radius:44px;
    overflow:hidden;
    isolation:isolate;
    color:var(--text);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06);
    /* 背景：深绿基底 + 封面溢出的一层很淡的绿色泛光 + 卡片下方的大片暗涌 */
    background:
      radial-gradient(50% 20% at 24% 2%, rgba(130,245,205,.06) 0%, rgba(130,245,205,0) 74%),
      radial-gradient(66% 26% at 50% 42%, rgba(18,152,108,.11) 0%, rgba(18,152,108,0) 72%),
      radial-gradient(104% 52% at 50% 70%, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 82%),
      linear-gradient(180deg,#0A2E22 0%, #072018 20%, #04130E 46%, #030C09 66%, #071C15 100%);
  }

  /* ══ 状态栏 ══════════════════════════════════════ */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:54px;
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 26px 0;
    font-size:16px;font-weight:640;letter-spacing:.01em;
  }
  .statusbar .glyphs{display:flex;align-items:center;gap:6px}
  .statusbar svg{display:block}

  /* ══ 顶部导航 ════════════════════════════════════ */
  .nav{position:absolute;top:0;left:0;right:0;height:118px}
  .nav .collapse{
    position:absolute;left:14px;top:76px;
    width:36px;height:36px;display:grid;place-items:center;
    background:none;border:0;color:var(--text);cursor:pointer;border-radius:50%;
    transition:background .18s ease;
  }
  .nav .collapse:hover{background:rgba(255,255,255,.08)}
  .nav .collapse:active{transform:scale(.92)}
  .nav .head{
    position:absolute;left:56px;right:56px;top:70px;
    text-align:center;pointer-events:none;
  }
  .nav .head .ep-title{
    font-size:18px;font-weight:560;line-height:22px;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nav .head .show{
    margin-top:2px;
    font-size:13px;font-weight:560;line-height:16px;
    color:#E4EDE9;
  }

  /* ══ 封面舞台 ════════════════════════════════════ */
  /* 外框：把原本的蓝色 mat 换成绿色，并让它向背景渗光 */
  .plate{
    position:absolute;left:40px;top:121px;width:348px;height:348px;
    border-radius:2px;
    background:linear-gradient(180deg,var(--plate-hi) 0%, #0D8862 44%, var(--plate-lo) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.24),
      inset 0 0 0 1px rgba(255,255,255,.05),
      0 14px 34px -22px rgba(6,90,64,.85),
      0 0 48px -18px rgba(21,172,124,.30);
  }
  /* 外框上的高光斜切，模拟原文的布光方向 */
  .plate::after{
    content:"";position:absolute;inset:0;border-radius:2px;
    background:linear-gradient(142deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 42%);
    mix-blend-mode:screen;pointer-events:none;
  }

  .art{
    position:absolute;left:20px;top:20px;width:308px;height:308px;
    border-radius:13px;
    background:linear-gradient(133deg,var(--art-tl) 0%,var(--art-mid) 44%,var(--art-br) 100%);
    box-shadow:0 12px 26px -10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    overflow:hidden;
  }
  /* 卡片自身的柔光，避免大块死黑 */
  .art::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 80% at 18% 6%,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 58%);
    pointer-events:none;
  }

  .art .show{
    position:absolute;left:24px;top:21px;
    font-size:16px;font-weight:700;line-height:1;letter-spacing:-.012em;
    color:var(--accent-soft);
  }
  /* 无圆底：麦克风直接居中在卡面上 */
  .micmark{
    position:absolute;left:50%;top:50%;
    width:60px;height:120px;
    transform:translate(-50%,-50%);
    display:block;
    filter:drop-shadow(0 0 26px rgba(36,210,149,.42));
  }

  /* ══ 轮播圆点 ════════════════════════════════════ */
  .dots{
    position:absolute;left:0;right:0;top:485px;
    display:flex;justify-content:center;align-items:center;gap:7px;
  }
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.30);transition:background .2s ease}
  .dots i.on{background:#fff}

  /* ══ 操作图标行 ══════════════════════════════════ */
  .actions{
    position:absolute;left:105px;top:579px;width:243px;height:24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .actions button{
    width:24px;height:24px;background:none;border:0;padding:0;cursor:pointer;
    color:rgba(255,255,255,.92);display:grid;place-items:center;
    transition:transform .16s ease,color .16s ease;
  }
  .actions button:hover{color:#fff;transform:translateY(-2px)}
  .actions button:active{transform:scale(.9)}
  .actions button.on{color:var(--accent-soft)}
  .actions svg{display:block}

  /* ══ 进度条 ══════════════════════════════════════ */
  .scrub{
    position:absolute;left:0;right:0;top:679px;height:26px;
    display:flex;align-items:center;
    padding:0 11px 0 17px;gap:10px;
  }
  .scrub .t{font-size:13px;font-weight:500;color:var(--text-dim);font-variant-numeric:tabular-nums;flex:none}
  .scrub .t.right{min-width:39px;text-align:right}
  .track{
    position:relative;flex:1;height:3px;border-radius:2px;
    background:rgba(255,255,255,.22);
    cursor:pointer;
  }
  .track .buf{position:absolute;inset:0 auto 0 0;width:0;border-radius:2px;background:rgba(255,255,255,.16)}
  .track .fill{
    position:absolute;inset:0 auto 0 0;width:15%;border-radius:2px;
    background:var(--accent);
    box-shadow:0 0 10px rgba(38,214,153,.75);
  }
  .track .knob{
    position:absolute;top:50%;left:15%;width:16px;height:16px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);
    box-shadow:0 0 0 .5px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.55), 0 0 14px rgba(38,214,153,.45);
    transition:transform .12s ease;
  }
  .track:hover .knob{transform:translate(-50%,-50%) scale(1.12)}

  /* ══ 播放控制 ════════════════════════════════════ */
  .controls{position:absolute;left:0;right:0;top:779px;height:73px}
  .controls button{
    position:absolute;top:50%;transform:translate(-50%,-50%);
    background:none;border:0;padding:0;cursor:pointer;color:#fff;
    display:grid;place-items:center;
    transition:transform .16s ease;
  }
  .controls button:active{transform:translate(-50%,-50%) scale(.9)}
  .ctl-speed{
    left:22.8px;width:29.7px;height:29.7px;border:1.3px solid rgba(255,255,255,.85);border-radius:50%;
    font-size:11px;font-weight:500;letter-spacing:-.02em;
  }
  .ctl-back{left:112px;width:35px;height:35px}
  .ctl-play{left:214px;width:73px;height:73px}
  .ctl-fwd{left:316px;width:35px;height:35px}
  .ctl-focus{left:404.8px;width:26px;height:26px}
  .ctl-back svg,.ctl-fwd svg{width:35px;height:35px;display:block}
  .ctl-play svg{width:73px;height:73px;display:block}
  .ctl-focus svg{width:26px;height:26px;display:block}

  .controls button:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px;border-radius:50%}
  .nav .collapse:focus-visible,.actions button:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px;border-radius:6px}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<div class="fit" id="fit">
<div class="canvas" id="canvas">
<div class="screen" id="screen">

  <!-- ── 状态栏 ─────────────────────────────────── -->
  <div class="statusbar">
    <span>11:35</span>
    <span class="glyphs">

<script>
(function () {
  /* ── 把 428×926 的屏幕等比缩放进可视区域 ── */
  var fitBox = document.getElementById('fit');
  var canvas = document.getElementById('canvas');
  function fit() {
    var pad = 56;
    var s = Math.min(1, (window.innerWidth - pad) / 428, (window.innerHeight - pad) / 926);
    fitBox.style.width  = (428 * s) + 'px';
    fitBox.style.height = (926 * s) + 'px';
    canvas.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ── 播放 / 暂停 ── */
  var TOTAL = 988;          // 16:28
  var cur = 148;            // 02:28
  var playing = false;
  var timer = null;

  var playBtn = document.getElementById('play');
  var glyph   = document.getElementById('playGlyph');
  var fill    = document.getElementById('fill');
  var knob    = document.getElementById('knob');
  var tCur    = document.getElementById('tCur');
  var tLeft   = document.getElementById('tLeft');
  var track   = document.getElementById('track');

  var PLAY_PATH  = glyph.getAttribute('d');
  var PAUSE_PATH = 'M27.5 23.4a2 2 0 0 1 2-2h4.6a2 2 0 0 1 2 2v27.2a2 2 0 0 1-2 2h-4.6a2 2 0 0 1-2-2Z'
                 + 'M40.4 23.4a2 2 0 0 1 2-2h4.6a2 2 0 0 1 2 2v27.2a2 2 0 0 1-2 2h-4.6a2 2 0 0 1-2-2Z';

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' + m : m) + ':' + (r < 10 ? '0' : '') + r;
  }
  function render() {
    var pct = Math.min(100, (cur / TOTAL) * 100);
    fill.style.width = pct + '%';
    knob.style.left  = pct + '%';
    tCur.textContent  = fmt(cur);
    tLeft.textContent = '-' + fmt(TOTAL - cur);
    track.setAttribute('aria-valuenow', Math.round(cur));
    track.setAttribute('aria-valuetext', fmt(cur));
  }
  function tick() {
    cur += 1;
    if (cur >= TOTAL) { cur = TOTAL; setPlaying(false); }
    render();
  }
  function setPlaying(on) {
    playing = on;
    playBtn.setAttribute('aria-pressed', String(on));
    playBtn.setAttribute('aria-label', on ? '暂停' : '播放');
    glyph.setAttribute('d', on ? PAUSE_PATH : PLAY_PATH);
    if (timer) { clearInterval(timer); timer = null; }
    if (on) timer = setInterval(tick, 1000);
  }

  playBtn.addEventListener('click', function () { setPlaying(!playing); });

  /* ── 拖动进度 ── */
  var dragging = false;
  function seekFromX(clientX) {
    var r = track.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    cur = pct * TOTAL;
    render();
  }
  track.addEventListener('pointerdown', function (e) {
    dragging = true; track.setPointerCapture(e.pointerId); seekFromX(e.clientX);
  });
  track.addEventListener('pointermove', function (e) { if (dragging) seekFromX(e.clientX); });
  track.addEventListener('pointerup',   function () { dragging = false; });
  track.addEventListener('pointercancel', function () { dragging = false; });
  track.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { cur = Math.min(TOTAL, cur + 15); render(); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { cur = Math.max(0, cur - 15);   render(); e.preventDefault(); }
  });

  /* ── 倍速 ── */
  var speeds = ['1.0x', '1.25x', '1.5x', '2.0x', '0.8x'];
  var si = 0, speedBtn = document.getElementById('speed');
  speedBtn.addEventListener('click', function () {
    si = (si + 1) % speeds.length;
    speedBtn.textContent = speeds[si];
  });

  /* ── 收藏 ── */
  var like = document.getElementById('like');
  var heart = document.getElementById('heartPath');
  like.addEventListener('click', function () {
    var on = like.classList.toggle('on');
    like.setAttribute('aria-pressed', String(on));
    heart.setAttribute('fill', on ? 'currentColor' : 'none');
  });

  /* ── 前后 30 秒 ── */
  document.querySelector('.ctl-back').addEventListener('click', function () {
    cur = Math.max(0, cur - 30); render();
  });
  document.querySelector('.ctl-fwd').addEventListener('click', function () {
    cur = Math.min(TOTAL, cur + 30); render();
  });

  render();
})();
</script>
</body>
</html>
